global
    log stdout format raw local0
    maxconn 1024
    ssl-default-bind-options ssl-min-ver TLSv1.2
defaults
    mode http
    log global
    # Do not log URLs: launch tickets and application paths can be sensitive.
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout tunnel 2m
    retries 0
    default-server resolvers docker resolve-prefer ipv4 init-addr libc,none

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

frontend public
    bind :28443 ssl crt /etc/tunnel/public.pem
    http-request set-header X-Forwarded-Proto https
    acl agent_path path_beg /tunnel/
    acl application_host hdr(host) -m end .apps.tunnel.test:28443
    use_backend agents if agent_path
    use_backend applications if application_host
    default_backend console

# These two listeners are reachable only through loopback published ports.
# They deliberately bypass health checks for drain/undrain management.
frontend management_a
    bind :28444 ssl crt /etc/tunnel/public.pem
    default_backend direct_a
frontend management_b
    bind :28445 ssl crt /etc/tunnel/public.pem
    default_backend direct_b
backend direct_a
    server node-a node-a:8080
backend direct_b
    server node-b node-b:8080

backend console
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host console.tunnel.test:28443
    http-check expect status 200
    server node-a node-a:8080 check inter 500ms fall 2 rise 2
    server node-b node-b:8080 check inter 500ms fall 2 rise 2
backend applications
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host console.tunnel.test:28443
    http-check expect status 200
    server node-a node-a:8080 check inter 500ms fall 2 rise 2
    server node-b node-b:8080 check inter 500ms fall 2 rise 2 backup
backend agents
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host console.tunnel.test:28443
    http-check expect status 200
    server node-b node-b:8080 check inter 500ms fall 2 rise 2
    server node-a node-a:8080 check inter 500ms fall 2 rise 2 backup
