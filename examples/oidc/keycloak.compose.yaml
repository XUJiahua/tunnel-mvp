# Local development only; run tunnel on the host using server.development.json.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev"]
    ports: ["127.0.0.1:8081:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set a local Keycloak administrator password}
    volumes:
      - keycloak-data:/opt/keycloak/data
volumes:
  keycloak-data:
