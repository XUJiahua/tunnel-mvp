# Replace the target and install the same token file used by the Server.
# Prometheus must resolve console.example.com and trust its HTTPS certificate.
scrape_configs:
  - job_name: tunnel
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/tunnel_metrics_token
    static_configs:
      - targets: [console.example.com]
rule_files:
  - /etc/prometheus/tunnel-alerts.yml
