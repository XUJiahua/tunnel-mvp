services:
  control:
    build: .
    command: ["server", "--config", "/app/server.json"]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      TUNNEL_ADMIN_PASSWORD: ${TUNNEL_ADMIN_PASSWORD:?Set a 12-72 byte bootstrap password}
      TUNNEL_METRICS_TOKEN: ${TUNNEL_METRICS_TOKEN:-}
      TUNNEL_STORAGE: ${TUNNEL_STORAGE:-}
      TUNNEL_OIDC_ISSUER: ${TUNNEL_OIDC_ISSUER:-}
      TUNNEL_OIDC_CLIENT_ID: ${TUNNEL_OIDC_CLIENT_ID:-}
      TUNNEL_OIDC_SESSION_MINUTES: ${TUNNEL_OIDC_SESSION_MINUTES:-}
      TUNNEL_OIDC_CLIENT_SECRET: ${TUNNEL_OIDC_CLIENT_SECRET:-}
    volumes:
      - ./examples/server.production.json:/app/server.json:ro
      - tunnel-data:/var/lib/tunnel
    restart: unless-stopped
volumes:
  tunnel-data:
