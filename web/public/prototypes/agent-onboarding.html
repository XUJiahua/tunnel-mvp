<body>
  <header class="prototype-bar" aria-label="原型体验工具">
    <div class="prototype-title"><span class="prototype-label">交互原型</span><strong>Agent 接入 · v3</strong><span class="research-note">仅使用模拟数据，不连接真实控制面</span></div>
    <div class="research-controls">
      <div class="variants" aria-label="流程对照"><button type="button" data-action="variant" data-value="B">新版流程</button><button type="button" data-action="variant" data-value="A">现状对照</button></div>
      <select id="scenario" aria-label="模拟连接场景"><option value="success">正常接入</option><option value="acl">白名单拒绝</option><option value="credential">凭据失效</option></select>
      <button class="text" data-action="reset">重置</button>
    </div>
  </header>
  <details class="research-drawer"><summary>体验说明与显示设置</summary><div class="flex wrap" style="padding-bottom:10px"><button class="secondary" data-action="large">切换大字</button><button class="secondary" data-action="long">填入长名称</button><button class="secondary" data-action="resume-demo">体验中途恢复</button></div><p>关闭接入窗口可切换场景；切换保留输入。此页面是交互设计原型。连接、探测、下载凭据和打开应用均为模拟；安装命令仅展示交互，不代表已有安装助手。输入只保留在当前页面内存中，刷新后清空。切换流程对照保留输入和接入进度。</p></details>
  <div class="shell">
    <aside class="sidebar" aria-label="工作空间导航">
      <div class="brand"><span class="mark" id="brand-mark"></span><span>tunnel<span class="period">.</span></span></div>
      <div class="workspace"><span class="workspace-avatar">T</span><div>我的工作空间<small>默认组织 · 自托管控制面</small></div></div>
      <nav><p class="nav-label">工作空间</p><div class="nav-list"><button class="nav-item" data-nav="overview" data-action="nav" data-value="overview"><span data-icon="grid"></span>概览</button><button class="nav-item active" data-nav="sites" data-action="nav" data-value="sites"><span data-icon="server"></span>站点<span class="count">3</span></button><button class="nav-item" data-nav="apps" data-action="nav" data-value="apps"><span data-icon="apps"></span>应用<span class="count" id="app-count">4</span></button><button class="nav-item" data-nav="help" data-action="help"><span data-icon="shield"></span>接入帮助</button></div></nav>
      <div class="sidebar-bottom"><span class="workspace-avatar" style="border-radius:50%;font-size:11px">林</span><div>林予安<small>组织管理员</small></div></div>
    </aside>
    <main class="main"><div class="topbar"><div class="breadcrumb"><span>工作空间</span><span>/</span><strong id="breadcrumb-page">站点</strong></div><div class="flex tiny muted"><span class="dot" style="color:var(--green)"></span><span class="status-text">控制面已连接</span><button class="icon" data-action="refresh" aria-label="刷新页面数据"><span data-icon="refresh"></span></button></div></div><div class="content" id="dashboard"></div></main>
  </div>
  <dialog id="wizard" aria-labelledby="wizard-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    // Standalone design harness: all data is synthetic, memory-only, and no API is called.
    const $=s=>document.querySelector(s);
    const icons={link:'<path d="m10 13 4-4m-7 5-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m1 5 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/>',server:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',apps:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>',shield:'<path d="m12 3 8 3v5c0 5-8 10-8 10S4 16 4 11V6l8-3Z"/><path d="m8 11 3 3 5-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',terminal:'<path d="m5 6 5 5-5 5m8 0h6"/>',refresh:'<path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5m-4 8a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',external:'<path d="M14 3h7v7m0-7L10 14m0-9H4v15h15v-6"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',alert:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3h.01"/>'};
    const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.server}</svg>`;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initial=()=>({variant:new URLSearchParams(location.search).get('variant')==='A'?'A':'B',scenario:['success','acl','credential'].includes(new URLSearchParams(location.search).get('scenario'))?new URLSearchParams(location.search).get('scenario'):'success',page:'sites',started:false,step:1,site:'',agent:'',hostname:'hz-dev-01',target:'http://10.20.1.15:8080',app:'',method:'linux',platform:'linux_amd64',cidr:'10.20.1.15/32',range:'10.20.1.0/24',approved:false,service:true,installMode:'foreground',online:false,waiting:false,authFailed:false,credentialReplaced:false,probing:false,probe:'idle',repaired:false,completed:false,skipped:false,secretShown:false,error:'',renameError:'',renameReturn:'wizard',draftAgent:'',draftSite:'',draftApp:'',view:'wizard',configDownloaded:false,repairDownloaded:false});
    let state=initial(),generation=0,toastTimer,returnFocus=null;
    const wizard=$('#wizard');
    function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;toastTimer=setTimeout(()=>$('#toast').textContent='',3300)}
    function parsedTarget(){try{const u=new URL(state.target);if(!['http:','https:'].includes(u.protocol)||u.username||u.password||!u.hostname)return null;return u}catch{return null}}
    function appName(){return state.app||parsedTarget()?.host||'待接入应用'}
    function deviceName(){return state.agent||(state.online?state.hostname:'连接后自动识别')}
    function siteName(){return state.site||(state.online?state.hostname:'新接入')}
    function targetInfo(){const u=parsedTarget();if(!u)return{host:'—',port:'—',ip:false,cidr:'—'};const host=u.hostname.replace(/^\[|\]$/g,'');const ip=/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)||host.includes(':');return{host,port:Number(u.port||(u.protocol==='https:'?443:80)),ip,cidr:host.includes(':')?host+'/128':host+'/32'}}
    function allowRules(){const t=targetInfo();return state.target&&parsedTarget()?[{cidr:t.ip?t.cidr:state.range,...(!t.ip?{host:t.host}:{}),ports:[t.port]}]:[{cidr:state.range||'10.20.1.0/24',ports:[80,443]}]}
    function generatedConfig(){return{serverURL:'https://console.example.com',siteID:'demo_site_hangzhou',instanceID:'demo_agent_01',allow:allowRules()}}
    function command(){if(state.method==='docker')return 'docker compose --env-file agent.env up -d';if(state.installMode==='service'&&state.method==='linux')return 'sudo systemctl daemon-reload\nsudo systemctl enable --now tunnel-agent';return state.platform.startsWith('windows')?'$env:TUNNEL_AGENT_TOKEN = Read-Host "输入实例令牌" -MaskInput\n.\\tunnel.exe agent --config agent.local.json':'read -rs TUNNEL_AGENT_TOKEN\nexport TUNNEL_AGENT_TOKEN\n./tunnel agent --config agent.local.json'}
    function renderDashboard(){const active=state.completed,online=state.online,started=state.started;document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.nav===state.page));$('#breadcrumb-page').textContent=state.page==='apps'?'应用':state.page==='overview'?'概览':'站点';$('#app-count').textContent=active&&!state.skipped?'5':'4';const pending=started?`已保留到第 ${state.step} 步 · ${['','填写应用地址','部署 Agent','验证应用','接入完成'][state.step]}`:'填写要访问的地址，再在内网机器上启动 Agent。';$('#dashboard').innerHTML=`<div class="heading-row"><div><span class="eyebrow">WORKSPACE / ${state.page==='apps'?'APPLICATIONS':'SITES'}</span><h1>${state.page==='apps'?'内网应用':state.page==='overview'?'连接每一个工作现场':'站点'}</h1><p class="intro">${state.page==='apps'?'访问已授权的应用，查看实际连接状态。':'连接内网应用，无需开放入站端口。设备名称在连接后自动识别。'}</p></div><button class="primary" data-action="start">${icon('plus')}接入应用</button></div>
      <div class="stats"><div class="stat"><small>已创建站点</small><div class="stat-number">03</div><small>默认组织</small></div><div class="stat"><small>Agent 已连接</small><div class="stat-number">${online?'03':'02'}</div><small>${online?'所有站点已连接':'1 个站点等待接入'}</small></div><div class="stat"><small>已验证应用</small><div class="stat-number">${active&&!state.skipped?'05':'04'}</div><small>经过真实路径检测</small></div></div>
      ${!active?`<section class="resume-card" aria-label="待完成的接入"><span class="resume-icon">${icon(started?'clock':'link')}</span><div class="resume-copy"><h3>${started?'继续完成':'准备接入'}「${esc(state.online?deviceName():appName())}」</h3><p>${esc(pending)}</p></div><button class="primary" data-action="resume">${started?'继续接入':'开始接入'}${icon('arrow')}</button></section>`:''}
      <div class="section-head"><div><h2>${state.page==='apps'?'应用列表':'你的站点'} <span class="muted tiny">${state.page==='apps'?'':'03'}</span></h2><p>${state.page==='apps'?'隧道在线与应用可达分别验证。':'站点信息、Agent 连接与应用状态，在这里一起查看。'}</p></div></div>
      <div class="site-grid">${siteCard('上海数据中心','2 个 Agent · 3 个应用','华东生产网络',true,false)}${siteCard('北京协作环境','1 个 Agent · 1 个应用','研发与协作服务',true,false)}${siteCard(state.online?siteName():appName(),online?`1 个 Agent · ${state.target?'1':'0'} 个应用`:'等待首个 Agent 连接',online?(state.probe==='success'?'已完成连接验证':'Agent 已连接，应用待验证'):(started?'配置已生成，可继续部署':'部署在可访问目标应用的机器上'),online,true)}</div>
      <div class="help-strip">${icon('shield')}<div><h3>只连接你明确允许的目标</h3><p>安装前确认目标地址与端口。添加应用不会自动扩大 Agent 的本地访问范围。</p></div></div><footer class="page-footer"><span><strong>tunnel.</strong> 多站点访问网关</span><span>私有网络 · 统一访问</span></footer>`;updateResearch()}
    function siteCard(name,meta,description,online,draft){const appView=state.page==='apps',verified=!draft||state.probe==='success';return`<article class="site-card ${draft&&!online?'draft':''}"><div class="flex between"><span class="site-icon">${icon(appView?'apps':'server')}</span><span class="badge ${online?'':state.started&&draft?'warn':'gray'}"><span class="dot"></span>${online?(appView?(verified?'HTTP 200':'尚未验证'):'已连接'):(state.started?'接入未完成':'待接入')}</span></div><h3>${esc(appView?(draft?appName():name==='上海数据中心'?'数据面平台':'协作控制台'):name)}</h3><p class="tiny muted" style="overflow-wrap:anywhere">${draft&&online?esc(deviceName())+' · ':''}${esc(description)}</p><div class="site-meta"><span>${esc(meta)}</span><span>${online?(verified?'应用已验证':'应用待验证'):'连接后自动识别设备'}</span></div><div class="site-actions"><button class="text" data-action="${draft?(online?(verified?'open-app':'continue-verify'):'resume'):'sample'}">${draft?(online?(verified?'打开应用 ↗':'继续验证 →'):state.started?'继续接入 →':'部署 Agent →'):'查看应用 →'}</button><button class="text muted" data-action="${draft?(online?'rename':'instructions'):'sample'}">${draft&&online?'修改名称':'部署说明'}</button>${draft&&online?'<button class="text muted" data-action="instructions">部署说明</button>':''}</div></article>`}
    function updateResearch(){document.querySelectorAll('[data-action=variant]').forEach(b=>{b.classList.toggle('active',b.dataset.value===state.variant);b.setAttribute('aria-pressed',b.dataset.value===state.variant)});$('#scenario').value=state.scenario}
    function start(){const resuming=state.started;state.started=true;state.error='';state.view='wizard';returnFocus=document.activeElement;if(!wizard.open)wizard.showModal();renderWizard(!resuming);renderDashboard()}
    function closeWizard(){wizard.close();renderDashboard();requestAnimationFrame(()=>{const target=returnFocus?.isConnected?returnFocus:document.querySelector('[data-action=resume]')||document.querySelector('[data-action=start]');target?.focus()})}
    function stepper(){return`<ol class="stepper" aria-label="接入进度">${['填写地址','部署 Agent','验证应用','完成接入'].map((text,i)=>`<li class="${state.step===i+1?'active':state.step>i+1?'done':''}" ${state.step===i+1?'aria-current="step"':''}><span class="step-num">${state.step>i+1?'✓':i+1}</span><span>${text}</span></li>`).join('')}</ol>`}
    function summary(){return`<aside class="side-summary" aria-label="接入信息摘要"><h3>这次接入</h3><dl><div class="summary-line"><dt>应用地址</dt><dd data-live="target">${state.target?esc(state.target):'稍后添加应用'}</dd></div><div class="summary-line"><dt>部署方式</dt><dd>${{linux:'Linux 主机',docker:'Docker 容器',manual:'手动运行'}[state.method]}</dd></div><div class="summary-line"><dt>接入设备</dt><dd>${esc(deviceName())}</dd></div></dl><hr><div class="secure-label">${icon('shield')}仅访问你允许的目标</div><p class="aside-note">设备连接后自动使用主机名作为名称，之后可以修改。</p>${state.step===2?`<hr><p class="aside-note">${state.method==='docker'?'容器内的 localhost 指向容器自身。目标在宿主机时，请使用容器实际可达的地址。':'请在能够访问目标应用的内网机器上执行。连接控制面需要 HTTPS 与 WebSocket 出站能力。'}</p>`:''}</aside>`}
    function renderWizard(resetScroll=false){const scroll=wizard.querySelector('.dialog-content')?.scrollTop||0;const title=state.view==='names'?'修改显示名称':state.view==='app'?appName():state.variant==='A'?'Agent 接入':state.completed&&state.step===4?'接入已完成':'连接内网应用';const subtitle=state.view==='names'?'只改变控制台中的显示，不影响连接和机器主机名。':state.view==='app'?'已通过应用公网入口打开':state.variant==='A'?siteName():'填写地址，部署 Agent，然后验证访问';wizard.innerHTML=`<div class="dialog-frame"><header class="dialog-header"><div><h2 id="wizard-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="icon" data-action="close" aria-label="关闭并保留接入进度">${icon('close')}</button></header><div class="dialog-content">${state.view==='names'?namesForm():state.view==='app'?appDemo():state.variant==='A'?oldFlow():`${stepper()}${state.step===4?successStep():`<div class="wizard-grid"><section>${[null,infoStep,installStep,verifyStep][state.step]()}</section>${summary()}</div>`}`}</div>${footer()}</div>`;if(!resetScroll)wizard.querySelector('.dialog-content').scrollTop=scroll;if(resetScroll)requestAnimationFrame(()=>wizard.querySelector(state.view==='names'||state.step===1?'input':'button.primary')?.focus({preventScroll:true}));updateResearch()}
    function infoStep(){return`<div class="step-title"><h2>你想访问哪个内网应用？</h2></div><p class="step-description">填写从内网机器可以访问的地址，我们会准备对应的连接配置。</p><label class="field"><span class="field-label">内网应用地址 <span class="optional">也可稍后添加</span></span><input name="target" type="url" value="${esc(state.target)}" placeholder="http://10.20.1.15:8080" aria-describedby="target-help"><small id="target-help">支持 HTTP / HTTPS，例如业务平台、Grafana 或内部管理系统。</small></label><span class="field-label">Agent 部署方式</span><div class="deployment-options" role="group" aria-label="部署方式">${[['linux','Linux 主机','适合长期运行','server'],['docker','Docker 容器','已有容器环境','grid'],['manual','手动运行','macOS / Windows','terminal']].map(([key,label,hint,img])=>`<button class="option-card" data-action="method" data-value="${key}" aria-pressed="${state.method===key}">${icon(img)}<span class="option-name">${label}</span><small>${hint}</small>${state.method===key?'<span class="selected-mark">✓</span>':''}</button>`).join('')}</div><div id="target-dependent">${targetFields()}</div>${state.error?`<p class="error-text" role="alert">${esc(state.error)}</p>`:''}`}
    function targetFields(){const t=targetInfo();return`${!state.target||!t.ip?`<label class="field"><span class="field-label">本地允许网段</span><input name="range" value="${esc(state.range)}" placeholder="10.20.1.0/24"><small>${state.target?'内网域名由 Agent 解析；请确认实际 IP 所属网段。':'暂不配置应用时，请明确允许的网络范围。'}本地始终执行 IP 与端口校验。</small></label>`:''}<div class="allow-preview"><span>${state.target?'将生成的本地授权':'稍后可访问的范围'}<br><small>${state.target?'仅允许此目标使用的端口':'默认 HTTP / HTTPS 端口'}</small></span><code id="allow-preview-value">${esc(state.target&&parsedTarget()?(t.ip?t.cidr:state.range)+' · '+t.port:(state.range||'—')+' · 80, 443')}</code></div><label class="checkline"><input type="checkbox" name="approved" ${state.approved?'checked':''}><span>我确认 Agent 可以访问上述目标，并允许这个范围。</span></label>`}
    function installStep(){const win=state.platform.startsWith('windows');return`<div class="step-title"><h2>在内网机器上启动 Agent</h2></div><p class="step-description">配置已按目标地址生成，不需要手写 JSON。设备名称会在连接后自动识别。</p>${state.method!=='docker'?`<label class="field"><span class="field-label">运行平台</span><select name="platform" aria-label="运行平台">${(state.method==='linux'?[['linux_amd64','Linux · amd64'],['linux_arm64','Linux · arm64']]:[['darwin_arm64','macOS · Apple Silicon'],['darwin_amd64','macOS · Intel'],['windows_amd64','Windows · amd64'],['windows_arm64','Windows · arm64'],['linux_amd64','Linux · amd64']]).map(([v,l])=>`<option value="${v}" ${state.platform===v?'selected':''}>${l}</option>`).join('')}</select></label>`:''}${state.method==='linux'?`<div class="mode-tabs" aria-label="运行方式"><button data-action="install-mode" data-value="foreground" aria-pressed="${state.installMode==='foreground'}">先验证连接</button><button data-action="install-mode" data-value="service" aria-pressed="${state.installMode==='service'}">安装为系统服务</button></div>`:''}<div class="install-step"><span class="small-num">1</span><div class="install-body"><h3>${state.method==='docker'?'准备 Compose 与 Agent 配置':'准备程序与配置文件'}</h3><p>${state.method==='docker'?'将文件放在同一目录。镜像与配置使用相同的受支持版本。':'选择与平台匹配的程序，将配置放在同一目录。'}</p><div class="button-row"><button class="secondary" data-action="download-binary">${icon('download')}${state.method==='docker'?'下载 compose.yaml':'下载 Agent'}</button><button class="secondary" data-action="download-config">${icon('download')}${state.configDownloaded?'再次下载配置':'下载配置'}</button></div></div></div><div class="install-step"><span class="small-num">2</span><div class="install-body"><h3>设置设备连接凭据</h3><p>通过终端安全输入；${state.installMode==='service'?'服务使用仅本机可读的环境文件。':'凭据不会写入命令参数或配置文件。'}</p><button class="text" data-action="show-secret">${state.secretShown?'隐藏连接凭据':'显示本次连接凭据'}</button>${state.secretShown?`<div class="credential-area"><small>仅用于原型演示的占位值</small><code>DEMO_ONLY_NOT_A_VALID_AGENT_TOKEN</code><button class="text" data-action="copy-secret">复制演示凭据</button></div>`:''}</div></div>${state.installMode==='service'&&state.method==='linux'?`<div class="note gap">下载的服务定义使用 <code>/etc/tunnel/agent.local.json</code> 与受保护的 <code>/etc/tunnel/agent.env</code>。请按说明放置文件后启动。</div><button class="text" data-action="download-service">下载 systemd 服务与安装说明</button>`:''}<div class="install-step"><span class="small-num">3</span><div class="install-body"><h3>${state.method==='docker'?'启动容器':'执行启动命令'}</h3><div class="command-box"><pre>${esc(command())}</pre><button data-action="copy-command">复制命令</button></div></div></div><div aria-live="polite">${state.online?`<div class="connection-card success">${icon('check')}<div><h3>${esc(deviceName())} 已连接</h3><p>已从主机读取名称，接下来验证应用是否可达。</p></div></div>`:state.authFailed?`<div class="connection-card failure">${icon('alert')}<div><h3>设备凭据未被接受</h3><p>重新生成本设备凭据，再在内网机器上更新并重启。其他设备不受影响。</p><button class="text" data-action="replace-secret">重新生成本设备凭据</button></div></div>`:`<div class="connection-card">${state.waiting?'<span class="spinner"></span>':icon('clock')}<div><h3>${state.waiting?'正在确认设备连接…':'等待内网设备连接'}</h3><p>${state.waiting?'正在检查 HTTPS、隧道连接与设备身份。':'启动后会自动识别主机名。关闭窗口也可以稍后继续。'}</p></div></div>`}</div>`}
    function verifyStep(){return`<div class="connection-card success" style="margin-bottom:22px">${icon('check')}<div><h3>Agent 已连接</h3><p>${esc(deviceName())} · 已自动识别主机名</p></div></div><div class="step-title"><h2>再确认应用可以打开</h2></div><p class="step-description">这一步通过当前 Agent 检查目标地址，连接成功后再完成接入。</p>${!state.target?`<div class="note">你还没有添加应用。Agent 接入已完成，可以之后从站点添加应用并验证。</div>`:`<div class="target-card"><div class="flex between"><h3>${esc(appName())}</h3><span class="badge ${state.probe==='success'?'':state.probe==='failed'?'warn':'gray'}">${state.probe==='success'?'HTTP 200':state.probe==='failed'?'需要处理':'尚未验证'}</span></div><p class="target-url">${esc(state.target)}</p><div class="target-foot"><span class="muted">从接入设备 ${esc(deviceName())} 发起</span><button class="text" data-action="edit-target">修改目标</button></div></div><div class="check-list"><div class="check-item">${icon('check')}设备身份与隧道连接<span class="check-value">已确认</span></div><div class="check-item">${state.probe==='success'?icon('check'):state.probing?'<span class="spinner"></span>':icon('clock')}本地访问授权、TCP 与 HTTP<span class="check-value">${state.probe==='success'?'HTTP 200 · 42ms':state.probing?'检测中':state.probe==='failed'?'白名单拒绝':'等待检测'}</span></div></div>${state.probe==='success'?`<div class="note">应用已通过此 Agent 返回 HTTP 200。你可以完成接入并打开应用。</div>`:state.probe==='failed'?failurePanel():`<button class="primary" data-action="probe" ${state.probing?'disabled':''}>${state.probing?'正在检测连接…':'检测应用连接'}${!state.probing?icon('arrow'):''}</button>`}`}`}
    function failurePanel(){const t=targetInfo();return`<section class="failure-panel"><div class="failure-top"><h3>目标端口 ${esc(t.port)} 未被本地白名单允许</h3><p>Agent 隧道正常。当前 Agent 的本地配置仅允许 3000 端口，应用使用 ${esc(t.port)} 端口。</p></div><div class="failure-body"><h3>在 Agent 所在机器上修复</h3><ol class="repair-steps"><li><strong>下载修正配置。</strong>确认允许 ${esc(t.host)} 的 ${esc(t.port)} 端口，不扩大到其他目标。</li><li><strong>替换 agent.local.json 并重启 Agent。</strong>重启会关闭本实例已有连接。</li><li><strong>回到这里重新检测。</strong>不需要重建站点或应用。</li></ol><button class="secondary" data-action="download-repair">${icon('download')}${state.repairDownloaded?'再次下载修正配置':'下载修正配置'}</button><details class="details"><summary>查看规则与诊断详情</summary><pre>${esc(JSON.stringify({allow:allowRules()},null,2))}\n\n原因码：acl_denied\n实例：demo_agent_01\n目标：${esc(state.target)}\n请求 ID：demo_request_acl_01</pre></details><p class="tiny muted gap">控制台远程策略只能收紧权限。请修改并确认 Agent 的本地授权。</p><button class="primary gap" data-action="retry-repair" ${state.probing?'disabled':''}>${state.probing?'正在重新检测…':'已更新配置，重新检测'}</button></div></section>`}
    function successStep(){return`<div class="success-hero"><span class="success-mark">${icon('check')}</span><h2>${state.skipped?'设备接入完成':'你的内网应用，已经连接'}</h2><p>${state.skipped?'稍后可以继续添加并验证应用。':'设备已连接，应用已验证。现在就可以访问。'}</p></div><div class="success-box"><div class="success-row"><div>接入设备<small>${esc(deviceName())}</small></div><span class="badge">${icon('check')}已连接</span></div><div class="success-row"><div>应用地址<small style="overflow-wrap:anywhere">${state.target?esc(state.target):'稍后添加'}</small></div><span class="badge ${state.skipped?'gray':''}">${state.skipped?'尚未验证':'HTTP 200 · 已验证'}</span></div></div><div style="max-width:510px;margin:0 auto 22px" class="flex between wrap"><p class="tiny muted">设备默认使用主机名，不需要提前起名。</p><button class="text" data-action="rename">修改名称（可选）</button></div><div class="success-actions">${!state.skipped?`<button class="primary" data-action="open-app">打开应用${icon('external')}</button>`:''}<button class="secondary" data-action="back-sites">返回站点</button></div><div class="note" style="max-width:510px;margin:0 auto 6px">${state.method==='linux'&&state.installMode==='foreground'?'当前为前台运行，关闭终端会停止 Agent。建议下一步设置开机启动。':state.method==='docker'?'请保持容器运行，并将配置和凭据保存在受保护的主机目录。':'请保持 Agent 持续运行。可以随时从站点查看部署说明。'}</div>${state.method==='linux'&&state.installMode==='foreground'?`<div style="text-align:center;margin-top:12px"><button class="text" data-action="service-next">配置开机启动 →</button></div>`:''}`}
    function namesForm(){return`<form id="names-form" style="max-width:570px;margin:26px auto 4px"><div class="note" style="margin-bottom:22px">已识别主机名：<code style="overflow-wrap:anywhere">${esc(state.hostname)}</code>。留空时自动使用默认名称。</div><label class="field"><span class="field-label">设备名称 <span class="optional">可选</span></span><input name="draftAgent" value="${esc(state.draftAgent)}" maxlength="100" placeholder="${esc(state.hostname)}"><small>修改的是显示名称，不会修改机器本身的主机名。</small></label><button class="text" data-action="use-hostname" type="button">恢复使用主机名</button><details class="details"><summary>应用与站点名称（可选）</summary><div style="padding-top:18px"><label class="field"><span class="field-label">应用名称</span><input name="draftApp" value="${esc(state.draftApp)}" maxlength="100" placeholder="${esc(parsedTarget()?.host||'内网应用')}"><small>默认使用应用地址。</small></label><label class="field"><span class="field-label">站点名称</span><input name="draftSite" value="${esc(state.draftSite)}" maxlength="100" placeholder="${esc(state.hostname)}"><small>用于整理设备。默认已自动创建，按需修改即可。</small></label></div></details><p class="tiny muted gap">更改名称不会重新生成凭据，也不会断开连接。</p></form>`}
    function openNames(button){if(!state.online){notify('设备连接后会自动识别主机名，无需提前起名');return}state.renameReturn=wizard.open?'wizard':'dashboard';state.draftAgent=state.agent;state.draftSite=state.site;state.draftApp=state.app;state.view='names';if(!wizard.open){returnFocus=button;wizard.showModal()}renderWizard(true)}
    function finishNames(save){if(save){state.agent=state.draftAgent.trim()||state.hostname;state.site=state.draftSite.trim()||state.hostname;state.app=state.draftApp.trim()}state.view='wizard';if(state.renameReturn==='dashboard')closeWizard();else renderWizard(true);renderDashboard();if(save)notify('名称已更新，现有连接保持不变')}
    function oldFlow(){return`<section class="old-flow"><div class="note warn">此令牌仅展示一次。请安全保存；关闭窗口后只能通过轮换生成新令牌。</div><label class="field gap"><span class="field-label">站点 ID</span><code>demo_site_hangzhou</code></label><label class="field"><span class="field-label">Agent 令牌</span><code>DEMO_ONLY_NOT_A_VALID_AGENT_TOKEN</code></label><button class="secondary" data-action="copy-secret">复制令牌</button><h3>1. 保存为 agent.local.json 并调整白名单</h3><pre>${esc(JSON.stringify({serverURL:'https://console.example.com',siteID:'demo_site_hangzhou',allow:[{cidr:'127.0.0.0/8',ports:[3000]},{cidr:'::1/128',ports:[3000]}]},null,2))}</pre><h3>2. 在内网机器运行</h3><pre>read -rs TUNNEL_AGENT_TOKEN\nexport TUNNEL_AGENT_TOKEN\n./tunnel agent --config agent.local.json</pre><p class="tiny muted">粘贴令牌后回车。非本机连接需使用 HTTPS；私有 CA 可通过系统信任库配置。</p></section>`}
    function appDemo(){return`<section class="app-demo"><span class="eyebrow">INTERNAL APPLICATION</span><h2 style="margin-top:12px">${esc(appName())}</h2><p class="muted gap">欢迎回来。你已经通过站点的独立 Agent 进入应用。</p><div class="demo-metrics"><div class="demo-metric">在线服务<strong>12</strong></div><div class="demo-metric">今日任务<strong>86</strong></div><div class="demo-metric">系统状态<strong style="font-size:20px">运行正常</strong></div></div><div class="note gap">这里是用于体验“打开应用”路径的示例页面。</div></section>`}
    function footer(){if(state.view==='names')return`<footer class="dialog-footer"><span class="footer-hint">不影响现有连接</span><div class="footer-buttons"><button class="secondary" data-action="cancel-names">取消</button><button class="primary" type="submit" form="names-form">保存名称</button></div></footer>`;if(state.view==='app')return`<footer class="dialog-footer"><span class="footer-hint">应用示例</span><button class="secondary" data-action="back-result">返回接入结果</button></footer>`;if(state.variant==='A')return`<footer class="dialog-footer"><span class="footer-hint">现状流程对照</span><button class="primary" data-action="close">已安全保存</button></footer>`;if(state.step===4)return`<footer class="dialog-footer"><span class="footer-hint">部署说明可随时查看</span><button class="text" data-action="instructions">查看部署说明</button></footer>`;return`<footer class="dialog-footer"><span class="footer-hint">${state.step===1?'关闭后可继续填写':'进度已保留在本页面'}</span><div class="footer-buttons">${state.step>1?'<button class="secondary" data-action="back">上一步</button>':''}${state.step===1?'<button class="primary" data-action="next">生成接入配置 →</button>':state.step===2?`<button class="primary" data-action="${state.online?'next':'connect'}" ${state.waiting?'disabled':''}>${state.online?'下一步：验证应用':state.waiting?'正在检查…':'我已启动，检查连接'}</button>`:`${state.probe!=='success'?'<button class="text skip-link" data-action="skip">稍后验证</button>':''}<button class="primary" data-action="complete" ${state.target&&state.probe!=='success'?'disabled':''}>完成接入</button>`}</div></footer>`}
    function validate(){if(state.target&&!parsedTarget())return'请输入有效的 HTTP / HTTPS 地址，地址中不能包含用户名或密码。';if((!state.target||!targetInfo().ip)&&!/^.+\/\d{1,3}$/.test(state.range))return'请填写明确的本地允许网段，例如 10.20.1.0/24。';if(!state.approved)return'请先确认 Agent 的本地访问范围。';return''}
    function next(){if(state.step===1){state.error=validate();if(state.error){renderWizard();const invalid=wizard.querySelector(state.target&&!parsedTarget()?'[name=target]':'[name=approved]');invalid?.focus();return}state.step=2}else if(state.step===2&&state.online)state.step=3;renderWizard(true);renderDashboard()}
    function simulateConnection(){if(state.waiting)return;state.waiting=true;state.authFailed=false;const own=++generation;renderWizard();setTimeout(()=>{if(own!==generation)return;state.waiting=false;if(state.scenario==='credential'&&!state.credentialReplaced){state.authFailed=true}else{state.online=true;state.agent=state.agent||state.hostname;state.site=state.site||state.hostname;}if(wizard.open)renderWizard();renderDashboard()},1400)}
    function probe(repair=false){if(state.probing)return;state.probing=true;const own=++generation;renderWizard();setTimeout(()=>{if(own!==generation)return;state.probing=false;state.repaired=state.repaired||repair;state.probe=state.scenario==='acl'&&!state.repaired?'failed':'success';if(wizard.open)renderWizard();renderDashboard()},1200)}
    function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已下载 '+name+'（演示文件）')}
    async function copyText(text,label){try{await navigator.clipboard.writeText(text);notify(label+'已复制')}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';wizard.append(t);t.select();const ok=document.execCommand('copy');t.remove();notify(ok?label+'已复制':'当前浏览器限制复制，请选择文本后复制')}}
    function action(name,value,button){switch(name){case'start':case'resume':start();break;case'close':case'back-sites':closeWizard();break;case'next':next();break;case'rename':openNames(button);break;case'cancel-names':finishNames(false);break;case'use-hostname':state.draftAgent=state.hostname;wizard.querySelector('[name=draftAgent]').value=state.hostname;notify('已填入识别到的主机名，保存后生效');break;case'back':state.step=Math.max(1,state.step-1);state.error='';renderWizard(true);break;case'method':state.method=value;state.platform=value==='manual'?'darwin_arm64':'linux_amd64';state.approved=false;renderWizard();break;case'install-mode':state.installMode=value;renderWizard();break;case'connect':simulateConnection();break;case'continue-verify':state.step=state.target?3:1;state.completed=false;state.skipped=false;state.view='wizard';start();break;case'probe':probe();break;case'retry-repair':probe(true);break;case'complete':state.skipped=!state.target;state.completed=true;state.step=4;renderWizard(true);renderDashboard();break;case'skip':state.skipped=true;state.completed=true;state.step=4;renderWizard(true);renderDashboard();break;case'edit-target':state.step=1;state.approved=false;renderWizard(true);break;case'replace-secret':state.credentialReplaced=true;state.authFailed=false;state.secretShown=true;renderWizard();notify('已生成本设备的演示凭据。更新后重新检查连接。');break;case'show-secret':state.secretShown=!state.secretShown;renderWizard();break;case'copy-secret':copyText('DEMO_ONLY_NOT_A_VALID_AGENT_TOKEN','演示凭据');break;case'copy-command':copyText(command(),'启动命令');break;case'download-config':state.configDownloaded=true;download('agent.local.json',JSON.stringify(generatedConfig(),null,2));renderWizard();break;case'download-repair':state.repairDownloaded=true;download('agent.local.json',JSON.stringify(generatedConfig(),null,2));renderWizard();break;case'download-binary':if(state.method==='docker')download('compose.yaml','# DESIGN PROTOTYPE ONLY — replace image with a verified release\nservices:\n  agent:\n    image: example.invalid/tunnel:verified-version\n    command: ["agent", "--config", "/etc/tunnel/agent.local.json"]\n    env_file: agent.env\n    volumes: ["./agent.local.json:/etc/tunnel/agent.local.json:ro"]\n    restart: unless-stopped\n','text/yaml');else download('agent-download-instructions.txt','交互原型：此文件代替平台下载行为，不包含可执行程序。\n所选平台：'+state.platform+'\n正式实现需提供已验证版本及校验和。\n','text/plain');break;case'download-service':download('tunnel-agent.service','[Unit]\nDescription=Tunnel Agent (design prototype)\nAfter=network-online.target\n[Service]\nExecStart=/opt/tunnel/tunnel agent --config /etc/tunnel/agent.local.json\nEnvironmentFile=/etc/tunnel/agent.env\nRestart=on-failure\nKillMode=control-group\n[Install]\nWantedBy=multi-user.target\n\n# 演示模板；安装前确认程序、配置、服务用户与凭据文件权限。\n','text/plain');break;case'open-app':if(!state.completed){notify('请先完成 Agent 和应用验证');break}state.view='app';if(!wizard.open){returnFocus=button;wizard.showModal()}renderWizard(true);break;case'back-result':state.view='wizard';state.step=4;renderWizard(true);break;case'instructions':state.view='wizard';state.step=2;state.started=true;if(!wizard.open){returnFocus=button;wizard.showModal()}renderWizard(true);break;case'service-next':state.step=2;state.installMode='service';renderWizard(true);break;case'variant':{const scroll=wizard.querySelector('.dialog-content')?.scrollTop||0;state.variant=value;const u=new URL(location.href);u.searchParams.set('variant',value);history.replaceState(null,'',u);if(wizard.open){renderWizard();wizard.querySelector('.dialog-content').scrollTop=scroll}renderDashboard();break}case'nav':state.page=value;renderDashboard();break;case'refresh':notify('页面数据已刷新，接入进度保留');break;case'sample':notify('示例站点；请从接入应用开始体验');break;case'help':notify('从待接入站点开始，完成四步即可访问第一个应用。');break;case'large':document.body.classList.toggle('large-type');notify('已切换文字大小');break;case'long':state.hostname='hangzhou-research-observability-connector-01';if(state.online){state.site=state.hostname;state.agent=state.hostname;}state.app='研发数据平台与业务可观测性控制台';state.target='https://observability.internal.example.com:8443/grafana/';state.approved=false;renderDashboard();if(wizard.open)renderWizard();notify('已填入长名称与内网域名场景');break;case'resume-demo':state.started=true;state.step=2;state.approved=true;renderDashboard();if(wizard.open)closeWizard();notify('从站点卡片点击“继续接入”');break;case'reset':if(confirm('重置本原型的输入与模拟进度？')){generation++;const variant=state.variant;state=initial();state.variant=variant;wizard.close();renderDashboard();notify('已重置原型')}break}}
    document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(b&&!b.disabled)action(b.dataset.action,b.dataset.value,b)});
    wizard.addEventListener('cancel',event=>{event.preventDefault();closeWizard()});
    wizard.addEventListener('input',event=>{const el=event.target;if(!el.name)return;const oldTarget=state.target;state[el.name]=el.type==='checkbox'?el.checked:el.value;if(['target','range'].includes(el.name)){state.approved=false;const check=wizard.querySelector('[name=approved]');if(check)check.checked=false;state.probe='idle';state.repaired=false;state.completed=false;const t=targetInfo(),v=wizard.querySelector('#allow-preview-value');if(v)v.textContent=state.target&&parsedTarget()?(t.ip?t.cidr:state.range)+' · '+t.port:(state.range||'—')+' · 80, 443';if(el.name==='target'&&Boolean(oldTarget)!==Boolean(state.target)){const dep=wizard.querySelector('#target-dependent');if(dep)dep.innerHTML=targetFields()}else if(el.name==='target'){const dep=wizard.querySelector('#target-dependent');const needsRange=state.target&&!t.ip;if(dep&&Boolean(dep.querySelector('[name=range]'))!==Boolean(needsRange))dep.innerHTML=targetFields()}}document.querySelectorAll('[data-live]').forEach(n=>n.textContent=state[n.dataset.live]||'稍后添加应用')});
    wizard.addEventListener('submit',event=>{if(event.target.id==='names-form'){event.preventDefault();finishNames(true)}});
    wizard.addEventListener('change',event=>{const el=event.target;if(el.name==='platform'){state.platform=el.value;renderWizard()}});
    $('#scenario').addEventListener('change',event=>{generation++;state.scenario=event.target.value;state.waiting=false;state.probing=false;state.authFailed=false;state.credentialReplaced=false;state.repaired=false;state.probe='idle';state.completed=false;state.skipped=false;if(state.scenario==='credential'){state.online=false;if(state.step>2)state.step=2}else if(state.step===4)state.step=3;renderDashboard();if(wizard.open)renderWizard();notify('场景已切换，输入保留')});
    document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));$('#brand-mark').innerHTML=icon('link');renderDashboard();if(new URLSearchParams(location.search).get('start')==='1')requestAnimationFrame(start);
  </script>
</body>
