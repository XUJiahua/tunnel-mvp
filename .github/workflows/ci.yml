name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make build
      - run: make test
      - name: Verify published v0.1.1 upgrade and rollback
        run: bash scripts/verify-upgrade.sh bin/tunnel "$RUNNER_TEMP/tunnel-upgrade"
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-v0.1.1-report
          path: ${{ runner.temp }}/tunnel-upgrade/report.json
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm run test:e2e
        working-directory: web
      - run: pnpm run test:e2e
        working-directory: web
        env:
          TUNNEL_TEST_STORAGE: sqlite
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: check
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-linux-amd64
          path: bin/tunnel

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Compile pure Go SQLite and platform file locks
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -o "$RUNNER_TEMP/tunnel-cross-check" ./cmd/tunnel
          go -C examples/oidc-app build -trimpath -o "$RUNNER_TEMP/oidc-app-cross-check" .

  keycloak-e2e:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [json, sqlite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: tunnel-linux-amd64
          path: bin
      - run: chmod +x bin/tunnel
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Prepare verified Keycloak distribution
        run: bash scripts/prepare-keycloak-e2e.sh "$RUNNER_TEMP/tunnel-keycloak"
      - name: Verify real IdP, OTP, Agent and back-channel logout
        run: pnpm exec playwright test tests/keycloak.spec.ts
        working-directory: web
        env:
          KEYCLOAK_HOME: ${{ runner.temp }}/tunnel-keycloak/server
          TUNNEL_TEST_STORAGE: ${{ matrix.storage }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: keycloak-e2e-${{ matrix.storage }}-failure
          path: web/test-results
