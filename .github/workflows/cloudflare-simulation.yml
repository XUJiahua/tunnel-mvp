name: cloudflare-public-simulation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-cloudflare.mjs'
      - '.github/workflows/cloudflare-simulation.yml'
permissions:
  contents: read
jobs:
  public-https-wss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make build
      - name: Install verified cloudflared
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.10.1/cloudflared-linux-amd64
          python3 - "$RUNNER_TEMP/cloudflared" <<'PY'
          import hashlib,sys
          with open(sys.argv[1],'rb') as source:
              digest=hashlib.file_digest(source,'sha256').hexdigest()
          assert digest=='3bfc539f45d2620c71debb7a86be0efa737ed5ccbad9eb85c787116900e5c586', 'cloudflared SHA-256 mismatch'
          PY
          chmod 755 "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Exercise real public HTTPS and WSS
        run: node scripts/verify-cloudflare.mjs --cloudflared "$RUNNER_TEMP/cloudflared" --output "$RUNNER_TEMP/cloudflare-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-public-simulation-report
          path: ${{ runner.temp }}/cloudflare-report.json
          retention-days: 14
